<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Robot AR Visualisation</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
  </style>

  <script>
    AFRAME.registerComponent("gif-texture", {
      schema: {
        src: { type: "selector" }
      },

      init: function () {
        const image = this.data.src;

        if (!image) {
          console.error("GIF source not found.");
          return;
        }

        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.colorSpace = THREE.SRGBColorSpace;

        const applyTexture = () => {
          const mesh = this.el.getObject3D("mesh");

          if (mesh && mesh.material) {
            mesh.material.map = texture;
            mesh.material.transparent = true;
            mesh.material.needsUpdate = true;
          }
        };

        this.el.addEventListener("object3dset", applyTexture);
        this.el.addEventListener("loaded", applyTexture);
        applyTexture();

        const startAnimation = () => {
          if (this.animationStarted) return;
          this.animationStarted = true;

          gifler(image.src).get((animation) => {
            animation.animateInCanvas(canvas);
            texture.needsUpdate = true;
          });
        };

        if (image.complete && image.naturalWidth > 0) {
          startAnimation();
        } else {
          image.addEventListener("load", startAnimation, {
            once: true
          });

          image.addEventListener("error", () => {
            console.error("Could not load GIF:", image.src);
          }, { once: true });
        }
      }
    });
  </script>
</head>

<body>
  <div id="status">
    Starting camera...
  </div>

  <!-- GIF sources -->
  <img id="approachGif"
       src="./Approach.gif"
       crossorigin="anonymous"
       style="display:none">

  <img id="lineGif"
       src="./Line.gif"
       crossorigin="anonymous"
       style="display:none">

  <img id="squareGif"
       src="./Square.gif"
       crossorigin="anonymous"
       style="display:none">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Target 0: Approach -->
    <a-entity
      mindar-image-target="targetIndex: 0"
      class="tracking-target"
      data-name="Approach">

      <a-plane
        position="0 0 0"
        width="1"
        height="1"
        material="shader: flat; transparent: true"
        gif-texture="src: #approachGif">
      </a-plane>
    </a-entity>

    <!-- Target 1: Line -->
    <a-entity
      mindar-image-target="targetIndex: 1"
      class="tracking-target"
      data-name="Line">

      <a-plane
        position="0 0 0"
        width="1"
        height="1"
        material="shader: flat; transparent: true"
        gif-texture="src: #lineGif">
      </a-plane>
    </a-entity>

    <!-- Target 2: Square -->
    <a-entity
      mindar-image-target="targetIndex: 2"
      class="tracking-target"
      data-name="Square">

      <a-plane
        position="0 0 0"
        width="1"
        height="1"
        material="shader: flat; transparent: true"
        gif-texture="src: #squareGif">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const statusText = document.getElementById("status");

    const targets = document.querySelectorAll(
      ".tracking-target"
    );

    targets.forEach((target) => {
      const name = target.dataset.name;

      target.addEventListener("targetFound", () => {
        statusText.textContent = name + " detected!";
      });

      target.addEventListener("targetLost", () => {
        statusText.textContent =
          "Target lost. Point the camera at Approach, Line, or Square.";
      });
    });

    scene.addEventListener("loaded", async () => {
      const mindarSystem =
        scene.systems["mindar-image-system"];

      try {
        await mindarSystem.start();

        statusText.textContent =
          "Camera ready. Point it at Approach, Line, or Square.";
      } catch (error) {
        console.error("AR camera failed to start:", error);

        statusText.textContent =
          "Camera could not start. Check camera permissions.";
      }
    });
  </script>
</body>
</html>
