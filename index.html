<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Robot AR Visualisation</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Fill the entire phone or desktop viewport. */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    /* Keep MindAR's camera/scanning UI over the camera feed. */
    .mindar-ui-overlay,
    .mindar-ui-scanning {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 1000;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font: 14px/1.4 Arial, sans-serif;
      text-align: center;
      pointer-events: none;
    }
  </style>

  <script>
    AFRAME.registerComponent("gif-texture", {
      schema: {
        src: { type: "selector" }
      },

      init: function () {
        const image = this.data.src;

        if (!image) {
          console.error("GIF source not found.");
          return;
        }

        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;

        const context = canvas.getContext("2d");

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.colorSpace = THREE.SRGBColorSpace;

        this.texture = texture;

        const applyTexture = () => {
          const mesh = this.el.getObject3D("mesh");

          if (mesh && mesh.material) {
            mesh.material.map = texture;
            mesh.material.transparent = true;
            mesh.material.needsUpdate = true;
          }
        };

        this.el.addEventListener("object3dset", applyTexture);
        this.el.addEventListener("loaded", applyTexture);

        applyTexture();

        const startAnimation = () => {
          if (this.animationStarted) return;
          this.animationStarted = true;

          gifler(image.src).get((animation) => {
            animation.animateInCanvas(canvas);
          });
        };

        if (image.complete && image.naturalWidth > 0) {
          startAnimation();
        } else {
          image.addEventListener("load", startAnimation, {
            once: true
          });

          image.addEventListener("error", () => {
            console.error("Could not load GIF:", image.src);
          }, { once: true });
        }
      },

      tick: function () {
        // Refresh the animated GIF texture on each render frame.
        if (this.texture) {
          this.texture.needsUpdate = true;
        }
      },

      remove: function () {
        if (this.texture) {
          this.texture.dispose();
        }
      }
    });
  </script>
</head>

<body>
  <div id="status">
    Starting camera...
  </div>

  <img id="approachGif"
       src="./Approach.gif"
       crossorigin="anonymous"
       style="display:none">

  <img id="lineGif"
       src="./Line.gif"
       crossorigin="anonymous"
       style="display:none">

  <img id="squareGif"
       src="./Square.gif"
       crossorigin="anonymous"
       style="display:none">

  <!--
    IMPORTANT:
    Do not add the "embedded" attribute.
    The scene should occupy the full viewport.
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Target 0: Approach -->
    <a-entity
      mindar-image-target="targetIndex: 0"
      class="tracking-target"
      data-name="Approach">

      <a-plane
        position="0 0 0"
        width="1"
        height="1"
        material="shader: flat; transparent: true"
        gif-texture="src: #approachGif">
      </a-plane>
    </a-entity>

    <!-- Target 1: Line -->
    <a-entity
      mindar-image-target="targetIndex: 1"
      class="tracking-target"
      data-name="Line">

      <a-plane
        position="0 0 0"
        width="1"
        height="1"
        material="shader: flat; transparent: true"
        gif-texture="src: #lineGif">
      </a-plane>
    </a-entity>

    <!-- Target 2: Square -->
    <a-entity
      mindar-image-target="targetIndex: 2"
      class="tracking-target"
      data-name="Square">

      <a-plane
        position="0 0 0"
        width="1"
        height="1"
        material="shader: flat; transparent: true"
        gif-texture="src: #squareGif">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const statusText = document.getElementById("status");

    document.querySelectorAll(".tracking-target").forEach((target) => {
      const name = target.dataset.name;

      target.addEventListener("targetFound", () => {
        statusText.textContent = name + " detected!";
      });

      target.addEventListener("targetLost", () => {
        statusText.textContent =
          "Target lost. Scan Approach, Line, or Square.";
      });
    });

    scene.addEventListener("loaded", async () => {
      const mindarSystem = scene.systems["mindar-image-system"];

      try {
        await mindarSystem.start();

        statusText.textContent =
          "Camera ready. Scan Approach, Line, or Square.";
      } catch (error) {
        console.error("Could not start AR camera:", error);

        statusText.textContent =
          "Camera unavailable. Check browser permissions and reload.";
      }
    });
  </script>
</body>
</html>
